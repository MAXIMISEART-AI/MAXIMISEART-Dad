name: W6 eksperyment

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest ${{ matrix.python-version }} -n ${{ matrix.workers }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        workers: ['4', '8']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Route py -3 to the selected Python
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8
      - name: Install test dependencies
        run: py -3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: py -3 -m pytest -n ${{ matrix.workers }} --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: junit-${{ matrix.python-version }}-n${{ matrix.workers }}
          path: junit.xml
          retention-days: 7

  runs-mutations:
    name: runs mutations parallel (powtórzenie ${{ matrix.rep }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rep: ['1', '2']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Runs mutations in parallel
        shell: pwsh
        run: |
          python .agents/skills/verify-jedno-uruchomienie-naraz/scripts/check_runs_mutations.py
          if ($LASTEXITCODE -ne 0) { throw "runs mutations failed ($LASTEXITCODE)" }
