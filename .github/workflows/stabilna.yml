name: Stabilna wersja

# Centrum rozliczeń on Dad's computer updates only from the branch `stabilna` (ADR 0014). After a successful CI run
# of a push to main, this moves `stabilna` forward to that commit, without force. A late
# run of an older commit leaves it where it is; tools/promuj_stabilna.py derives everything from the remote's state.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  promote:
    name: Promote green main to stabilna
    # A successful run means every job passed, Required CI status included.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Move stabilna forward to the green commit
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/promuj_stabilna.py "$COMMIT"
