name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number
    || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}${{ matrix.os == 'ubuntu-latest'
      && ', Linux' || '' }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.14'
          part: 1/2
        - os: ubuntu-latest
          python-version: '3.14'
          part: 2/2
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Route py -3 to the selected Python
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts"
        -Encoding utf8
    - name: Verify py -3 interpreter
      if: ${{ runner.os == 'Windows' }}
      run: "$actualVersion = py -3 -c \"import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')\"\
        \nif ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {\n  throw \"py -3\
        \ resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION.\"\
        \n}\n"
    - name: Install test dependencies
      if: ${{ runner.os == 'Windows' }}
      run: py -3 -m pip install --disable-pip-version-check -r requirements.txt
    - name: Install test dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      run: python -m pip install --disable-pip-version-check -e ".[dev]"
    - name: Run tests
      if: ${{ runner.os == 'Windows' }}
      run: "$files = py -3 tools/czesci_pytest.py ${{ matrix.part }}\nif ($LASTEXITCODE\
        \ -ne 0) {\n  throw \"Splitting the test files failed (exit code $LASTEXITCODE)\"\
        \n}\npy -3 -m pytest -n auto $files\n"
    - name: Run tests (Linux)
      if: ${{ runner.os == 'Linux' }}
      run: python -m pytest -n auto --junitxml "$RUNNER_TEMP/junit.xml" $(python tools/czesci_pytest.py
        ${{ matrix.part }})
    - name: Upload junit
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-linux-${{ strategy.job-index }}
        path: ${{ runner.temp }}/junit.xml
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
