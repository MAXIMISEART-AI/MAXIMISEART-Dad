name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  # A new push to a pull request or to main cancels the run of the older commit: the account runs at most 20 jobs at once.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  szybkie:
    # Short checks share one runner: alone, each spent most of its time on setup. mypy needs no Windows runner,
    # because --platform decides which sys.platform branches it checks; CI checks both systems.
    name: Ruff, mypy, Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install development dependencies (pinned FastAPI and Pydantic shape the contract)
        id: deps
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # Centrum rozliczeń: the committed build and contract must match their sources (tata has no Node).
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the contract from the server models
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run contract

      - name: Typecheck (tsc strict)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (Oxlint with anti-slop)
        working-directory: frontend
        run: npm run lint

      - name: Frontend rules (every contract field used, no process-name comparisons)
        working-directory: frontend
        run: npm run rules

      - name: Unused files, exports and dependencies (knip)
        working-directory: frontend
        run: npm run unused

      - name: Duplicated code (jscpd)
        working-directory: frontend
        run: npm run duplicates

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Require the committed contract and build to be fresh
        run: |
          stale="$(git status --porcelain -- frontend/src/api src/rozliczenia/centrum/static)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "The committed contract or build does not match its sources. Run 'npm run regen' in frontend/ and commit the result."
            echo "After a merge or rebase this is expected: merge=wygenerowane in .gitattributes keeps the current HEAD's copy of generated files."
            exit 1
          fi

      # Each Python check runs even when an earlier step failed, so one red check does not hide the others.
      # They come after the Frontend steps, which run as one chain, as the Frontend job did.
      - name: Lint Python code
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m ruff check

      - name: Typecheck Python code (Windows)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform win32

      - name: Typecheck Python code (Linux)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform linux

  plan:
    # Decides the pytest jobs of this run and whether Change mutations start (tools/plan_ci.py), from the unit times
    # of the last green main runs (artifact czasy-ci). Standard library only, so the runner's python3 runs it as is.
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tools/czasy_ci.py downloads the artifact czasy-ci of earlier runs.
      actions: read
    outputs:
      pytest: ${{ steps.plan.outputs.pytest }}
      mutacje-zmiany: ${{ steps.plan.outputs.mutacje-zmiany }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - name: Plan the units of work from the times of the last main runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/plan_ci.py plan --zdarzenie "${{ github.event_name }}" --baza HEAD^1 --czasy .ci-plan/czasy --wyjscie .ci-plan/plan.json

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: .ci-plan/plan.json
          retention-days: 7
          include-hidden-files: true
          # Re-running all jobs plans again; the jobs and Required read the plan of their attempt.
          overwrite: true

  pytest:
    # Tata has Windows, so both Pythons run there; Linux runs every file once more, for the tests Windows skips (POSIX
    # signals, process groups, the pre-push hook). The plan decides how many jobs each runs and which files (or crc32
    # shares of a long file) each takes, so that every job ends near the same time; E2E and the timing guard are units
    # of the Windows jobs it puts them in.
    name: ${{ matrix.nazwa }}
    needs: plan
    if: ${{ needs.plan.outputs.pytest != '[]' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # tools/czasy_ci.py reads the step times of this job from the run's jobs API.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pytest) }}
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Route py -3 to the selected Python
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        if: ${{ runner.os == 'Windows' }}
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        if: ${{ runner.os == 'Windows' }}
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      - name: Install test dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        # The pre-push hook test runs the real ruff and mypy from tools/ci_lokalnie.py.
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: .ci-plan

      # pytest with the job's files longest first, then its steps (E2E, timing guard), each with its own time limit,
      # also after red tests.
      - name: Run the planned units
        id: units
        run: python tools/plan_ci.py wykonaj --plan .ci-plan/plan.json --zadanie ${{ matrix.id }}

      - name: Upload E2E and timing guard evidence on failure
        if: ${{ failure() && steps.units.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            .verification/evidence/
            ${{ runner.temp }}/lustro/ostatni-blad-*.txt
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # Measurement and the proof that the planned units ran: Required checks the record against the plan.
      - name: Record the time of each unit of work
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/czasy_ci.py zadanie --tor "${{ runner.os }}-${{ steps.python.outputs.python-version }}" --junit .ci-czasy/junit.xml --wykonanie .ci-czasy/wykonanie.json --wyjscie ".ci-czasy/zapis/${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}.json"

      - name: Upload the unit times
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-zadanie-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-czasy/zapis/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  change-mutations:
    # Each mutation of a line the pull request changes in src/ must fail a test (tools/mutacje_zmiany.py):
    # a reviewer used to find these by hand, after CI was green. A push to main has no change to mutate,
    # so there the job does not start and takes no runner.
    # Each part takes every third mutation: 90 mutations of a seven-module refactor (#382) took 25 min on one busy Mac.
    name: Change mutations (${{ matrix.part }}/3)
    needs: plan
    if: ${{ needs.plan.outputs.mutacje-zmiany != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      - name: Mutate the changed lines of src/
        run: python tools/mutacje_zmiany.py --baza HEAD^1 --czesc ${{ matrix.part }}/3

  mutations:
    # A mutation check's verdict does not depend on the Python version, so it runs once, beside pytest.
    # Besides a skill's mutations it runs the skill's own check on unchanged code (the ci: key of its SKILL.md), so
    # agents need not run it on the Mac: Centrum --feature all and the TLA+ model of Aktualizacja narzędzia run only here.
    # A pull request runs only the skills whose verdict its changes can alter; a push to main runs them all.
    # Each part runs a third of the selected steps (a baseline or one mutation script) by their CI time: side by side on one
    # runner they exceed their time limits.
    name: Mutation checks (${{ matrix.part }}/3)
    runs-on: windows-latest
    permissions:
      contents: read
      # tools/czasy_ci.py reads the step times of this job from the run's jobs API.
      actions: read
    # tools/mutacje_skilli.py limits each script to 30 min; this catches a hang in the runner itself.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      # verify-centrum-rozliczen drives Centrum in Chromium.
      - name: Install Playwright
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run each verify skill's baseline check and prove it fails on broken variants
        id: skills
        # tee keeps the step lines (OK/FAIL <step> (N s)) for tools/czasy_ci.py; bash passes the output bytes through
        # unchanged and, with pipefail, fails with the exit code of tools/mutacje_skilli.py.
        shell: bash
        run: |
          mkdir -p .ci-czasy
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python tools/mutacje_skilli.py --czesc ${{ matrix.part }}/3 --zmiany-od HEAD^1 | tee .ci-czasy/mutacje.log
          else
            python tools/mutacje_skilli.py --czesc ${{ matrix.part }}/3 | tee .ci-czasy/mutacje.log
          fi

      # A red baseline (e.g. Centrum --feature all) leaves its screenshots and logs here; mutation copies keep none.
      - name: Upload baseline evidence on failure
        if: ${{ failure() && steps.skills.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-checks-evidence-${{ matrix.part }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      # Measurement only: a missing or broken record prints CZASY CI FAIL and does not fail the job.
      - name: Record the time of each unit of work
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/czasy_ci.py zadanie --tor "${{ runner.os }}-${{ steps.python.outputs.python-version }}" --mutacje .ci-czasy/mutacje.log --wyjscie ".ci-czasy/zapis/${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}.json"

      - name: Upload the unit times
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-zadanie-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .ci-czasy/zapis/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  required:
    # Configure only this stable status as required in branch protection.
    # It passes when every job succeeded, a job was skipped only because the plan gave it no work, and every pytest
    # job of the plan reported each of its units (no test file lost between jobs).
    name: Required CI status
    runs-on: ubuntu-latest
    needs:
      - plan
      - szybkie
      - pytest
      - mutations
      - change-mutations
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      # A missing plan or record is the verdict's to judge, not a failed download.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: plan
          path: .ci-plan

      - name: Download the unit times of every job of this run
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: czasy-zadanie-*
          merge-multiple: true
          path: .ci-czasy/zapisy

      - name: Require every CI check to succeed and every planned unit to report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/plan_ci.py werdykt --plan .ci-plan/plan.json --zapisy .ci-czasy/zapisy

      # On a push to main the unit times of every job of the run become the artifact czasy-ci, the one source of CI
      # times (tools/czasy_ci.py). Measurement only: a failure here prints CZASY CI FAIL and leaves the verdict above.
      - name: Merge the unit times into czasy-ci
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        run: python3 tools/czasy_ci.py scal --katalog .ci-czasy/zapisy --wyjscie .ci-czasy/czasy-ci.json

      - name: Upload czasy-ci
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: czasy-ci
          path: .ci-czasy/czasy-ci.json
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true
