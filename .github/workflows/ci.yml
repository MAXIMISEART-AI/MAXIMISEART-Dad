name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  # A new push to a pull request or to main cancels the run of the older commit: the account runs at most 20 jobs at once.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  szybkie:
    # Short checks share one runner: alone, each spent most of its time on setup. mypy needs no Windows runner,
    # because --platform decides which sys.platform branches it checks; CI checks both systems.
    name: Ruff, mypy, Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install development dependencies (pinned FastAPI and Pydantic shape the contract)
        id: deps
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      # Centrum rozliczeń: the committed build and contract must match their sources (tata has no Node).
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the contract from the server models
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run contract

      - name: Typecheck (tsc strict)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (Oxlint with anti-slop)
        working-directory: frontend
        run: npm run lint

      - name: Frontend rules (every contract field used, no process-name comparisons)
        working-directory: frontend
        run: npm run rules

      - name: Unused files, exports and dependencies (knip)
        working-directory: frontend
        run: npm run unused

      - name: Duplicated code (jscpd)
        working-directory: frontend
        run: npm run duplicates

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Require the committed contract and build to be fresh
        run: |
          stale="$(git status --porcelain -- frontend/src/api src/rozliczenia/centrum/static)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "The committed contract or build does not match its sources. Run 'npm run regen' in frontend/ and commit the result."
            echo "After a merge or rebase this is expected: merge=wygenerowane in .gitattributes keeps the current HEAD's copy of generated files."
            exit 1
          fi

      # Each Python check runs even when an earlier step failed, so one red check does not hide the others.
      # They come after the Frontend steps, which run as one chain, as the Frontend job did.
      - name: Lint Python code
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m ruff check

      - name: Typecheck Python code (Windows)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform win32

      - name: Typecheck Python code (Linux)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m mypy --platform linux

  pytest:
    # Tata has Windows, so both Pythons run there, each in two parts of similar CI time from
    # tools/czesci_pytest.py. Linux runs all files once, in two parts, for the tests Windows skips (POSIX
    # signals, process groups, the pre-push hook). Both pass the files longest first.
    # E2E and the timing guard are steps of the Windows parts, not jobs of their own: every job takes one of the
    # account's 20 runners. Each goes to the part that ends sooner without it (CI medians 25.10: 3.11 1/2 324 s
    # + E2E 60 s, 2/2 388 s; 3.14 1/2 320 s + E2E 61 s, 2/2 353 s + timing 26 s).
    name: pytest (Python ${{ matrix.python-version }}${{ matrix.os == 'ubuntu-latest' && ', Linux' || '' }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.11', '3.14']
        part: ['1/2', '2/2']
        include:
          # E2E and the timing guard run where the flag is: an entry that matches no combination adds a job instead.
          - os: windows-latest
            python-version: '3.11'
            part: '1/2'
            e2e: true
          - os: windows-latest
            python-version: '3.14'
            part: '1/2'
            e2e: true
          - os: windows-latest
            python-version: '3.14'
            part: '2/2'
            timing: true
          - os: ubuntu-latest
            python-version: '3.14'
            part: '1/2'
          - os: ubuntu-latest
            python-version: '3.14'
            part: '2/2'
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Route py -3 to the selected Python
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        if: ${{ runner.os == 'Windows' }}
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        if: ${{ runner.os == 'Windows' }}
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      - name: Install test dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        # The pre-push hook test runs the real ruff and mypy from tools/ci_lokalnie.py.
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: '[pomiar] Install the profiling plugin'
        shell: python
        env:
          PROFIL_DIR: ${{ runner.temp }}/profil
          PROFIL_MATRIX: ${{ toJSON(matrix) }}
        run: |
          import json, os, pathlib, subprocess, sys, sysconfig, time
          pathlib.Path(sysconfig.get_paths()["purelib"], "profil_ci.py").write_text('import json\nimport os\nimport time\n\nimport pytest\n\n_START = time.time()\n_WORKER = os.environ.get("PYTEST_XDIST_WORKER", "kontroler")\n_meta = {"worker": _WORKER, "pid": os.getpid(), "import": _START}\n_items = {}\n\n\ndef pytest_configure(config):\n    _meta["configure"] = time.time()\n\n\ndef pytest_collection_finish(session):\n    _meta["collected"] = time.time()\n    _meta["n_items"] = len(session.items)\n\n\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_protocol(item, nextitem):\n    cpu = time.process_time()\n    start = time.time()\n    yield\n    row = _items.setdefault(item.nodeid, {})\n    row.update(t0=start, t1=time.time(), cpu=time.process_time() - cpu)\n\n\ndef pytest_runtest_logreport(report):\n    if _WORKER == "kontroler" and getattr(report, "node", None) is not None:\n        return\n    row = _items.setdefault(report.nodeid, {})\n    row[report.when] = [round(report.duration, 4), report.outcome]\n\n\ndef pytest_sessionfinish(session):\n    _meta["finish"] = time.time()\n    _meta["cpu_total"] = time.process_time()\n    folder = os.environ["PROFIL_DIR"]\n    os.makedirs(folder, exist_ok=True)\n    with open(os.path.join(folder, f"profil-{_WORKER}.json"), "w", encoding="utf-8") as out:\n        json.dump({"meta": _meta, "items": _items}, out)\n', encoding="utf-8")
          folder = pathlib.Path(os.environ["PROFIL_DIR"])
          folder.mkdir(parents=True, exist_ok=True)
          spawn = []
          for _ in range(10):
              start = time.perf_counter()
              subprocess.run([sys.executable, "-c", "pass"], check=True)
              spawn.append(time.perf_counter() - start)
          git = []
          for _ in range(10):
              start = time.perf_counter()
              subprocess.run(["git", "--version"], check=True, capture_output=True)
              git.append(time.perf_counter() - start)
          meta = {"matrix": json.loads(os.environ["PROFIL_MATRIX"]), "cpu_count": os.cpu_count(), "python_spawn_s": spawn, "git_spawn_s": git}
          try:
              import psutil
              meta["psutil_physical"] = psutil.cpu_count(logical=False)
          except ImportError:
              meta["psutil_physical"] = None
          (folder / "meta.json").write_text(json.dumps(meta), encoding="utf-8")
          print(meta)

      - name: Run tests
        if: ${{ runner.os == 'Windows' }}
        run: |
          $files = py -3 tools/czesci_pytest.py ${{ matrix.part }}
          if ($LASTEXITCODE -ne 0) {
            throw "Splitting the test files failed (exit code $LASTEXITCODE)"
          }
          $env:PROFIL_DIR = "$env:RUNNER_TEMP\profil"
          $files | Out-File "$env:PROFIL_DIR\files.txt" -Encoding utf8
          $start = Get-Date
          py -3 -m pytest -n auto -p profil_ci --durations=0 --junitxml="$env:PROFIL_DIR\junit.xml" $files
          $code = $LASTEXITCODE
          "wall_s=$(((Get-Date) - $start).TotalSeconds)" | Out-File "$env:PROFIL_DIR\wall.txt" -Encoding utf8
          exit $code

      - name: '[pomiar] Collection time and imports'
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          $files = py -3 tools/czesci_pytest.py ${{ matrix.part }}
          $start = Get-Date
          py -3 -X importtime -m pytest --collect-only -q $files 2> "$env:RUNNER_TEMP\profil\importtime.txt" | Out-File "$env:RUNNER_TEMP\profil\collect.txt" -Encoding utf8
          "collect_s=$(((Get-Date) - $start).TotalSeconds)" | Out-File "$env:RUNNER_TEMP\profil\collect_wall.txt" -Encoding utf8

      - name: Run tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        env:
          PROFIL_DIR: ${{ runner.temp }}/profil
        run: |
          python tools/czesci_pytest.py --linux ${{ matrix.part }} > "$PROFIL_DIR/files.txt"
          start=$(date +%s.%N)
          set +e
          python -m pytest -n auto -p profil_ci --durations=0 --junitxml="$PROFIL_DIR/junit.xml" $(cat "$PROFIL_DIR/files.txt")
          code=$?
          echo "wall_s=$(python -c "import sys; print(float(sys.argv[2]) - float(sys.argv[1]))" "$start" "$(date +%s.%N)")" > "$PROFIL_DIR/wall.txt"
          exit $code

      - name: '[pomiar] Collection time and imports (Linux)'
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          PROFIL_DIR: ${{ runner.temp }}/profil
        run: |
          start=$(date +%s.%N)
          python -X importtime -m pytest --collect-only -q $(cat "$PROFIL_DIR/files.txt") 2> "$PROFIL_DIR/importtime.txt" > "$PROFIL_DIR/collect.txt" || true
          echo "collect_s=$(python -c "import sys; print(float(sys.argv[2]) - float(sys.argv[1]))" "$start" "$(date +%s.%N)")" > "$PROFIL_DIR/collect_wall.txt"

      - name: '[pomiar] Upload the profile'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: profil-${{ matrix.os }}-py${{ matrix.python-version }}-${{ strategy.job-index }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/profil/
          retention-days: 7
          if-no-files-found: error

      - name: E2E (verify-rozliczenia --variant all)
        id: e2e
        if: ${{ !cancelled() && matrix.e2e }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          py -3 .agents/skills/verify-rozliczenia/scripts/run_verification.py --variant all
          if ($LASTEXITCODE -ne 0) {
            throw "E2E verification failed (exit code $LASTEXITCODE)"
          }

      - name: Upload E2E evidence on failure
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-python-${{ matrix.python-version }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      # Straż czasu Przebiegu rozliczeń (spec #141, #145): benchmark „typowy tydzień” na syntetycznych
      # Wzorcach kształtu Wzorców taty (tools/syntetyczne_wzorce.py), bo prawdziwych nie ma w repozytorium.
      - name: 'Timing guard: generate synthetic Wzorce'
        id: timing-templates
        if: ${{ !cancelled() && matrix.timing }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tools/syntetyczne_wzorce.py "$env:RUNNER_TEMP\syntetyczne-wzorce"
          if ($LASTEXITCODE -ne 0) {
            throw "Synthetic Wzorce generation failed (exit code $LASTEXITCODE)"
          }

      - name: 'Timing guard: measure Przebieg rozliczeń (typowy tydzień)'
        id: timing-measure
        if: ${{ !cancelled() && steps.timing-templates.outcome == 'success' }}
        # The longest Timing guard job took 13 min (CI 20.10–25.10), its median 1 min.
        timeout-minutes: 30
        shell: pwsh
        run: |
          $templates = "$env:RUNNER_TEMP\syntetyczne-wzorce"
          python tools/benchmark_przebiegu.py measure --scenario typowy-tydzien `
            --templates-dir $templates --config "$templates\worker_mapping.yaml" `
            --mirror-dir "$env:RUNNER_TEMP\lustro" --journal "$env:RUNNER_TEMP\przebieg.jsonl" `
            --machine github-windows-latest
          if ($LASTEXITCODE -ne 0) {
            throw "Benchmark failed (exit code $LASTEXITCODE)"
          }

      - name: 'Timing guard: report timings and enforce the budget'
        id: timing-guard
        if: ${{ !cancelled() && steps.timing-measure.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          # Budżet mediany czasu ściany typowego tygodnia na runnerze; krok pada tylko powyżej niego.
          # Docelowo 3 × cel twardy po przeliczeniu na runner: 3 × 18 s (Mac M4 Max) × ~3,3 ≈ 180 000 ms.
          # Przelicznik 3,3 to Mac → komputer taty (i7-10875H); windows-latest ma podobną wydajność
          # jednego rdzenia.
          # Po #147 (ADR 0008) Przebieg trwa ~3 s na Macu, czyli ~10 s na runnerze: budżet przepuszcza
          # szum współdzielonych runnerów, a łapie powrót do pełnego zapisu przez openpyxl (~240 s).
          # To jedyne miejsce budżetu.
          PRZEBIEG_BUDGET_MS: '180000'
        run: |
          python tools/benchmark_przebiegu.py guard --journal "$env:RUNNER_TEMP\przebieg.jsonl" `
            --budget-ms $env:PRZEBIEG_BUDGET_MS --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
            throw "Przebieg rozliczeń exceeded the timing budget of $env:PRZEBIEG_BUDGET_MS ms (exit code $LASTEXITCODE)"
          }

      - name: Upload benchmark failure output
        if: ${{ failure() && (steps.timing-measure.outcome == 'failure' || steps.timing-guard.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: timing-guard-output
          path: ${{ runner.temp }}/lustro/ostatni-blad-*.txt
          retention-days: 7
          if-no-files-found: ignore

  change-mutations:
    # Each mutation of a line the pull request changes in src/ must fail a test (tools/mutacje_zmiany.py):
    # a reviewer used to find these by hand, after CI was green. A push to main has no change to mutate,
    # so there the job does not start and takes no runner.
    # Each part takes every third mutation: 90 mutations of a seven-module refactor (#382) took 25 min on one busy Mac.
    name: Change mutations (${{ matrix.part }}/3)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      - name: Mutate the changed lines of src/
        run: python tools/mutacje_zmiany.py --baza HEAD^1 --czesc ${{ matrix.part }}/3

  mutations:
    # A mutation check's verdict does not depend on the Python version, so it runs once, beside pytest.
    # Besides a skill's mutations it runs the skill's own check on unchanged code (the ci: key of its SKILL.md), so
    # agents need not run it on the Mac: Centrum --feature all and the TLA+ model of Aktualizacja narzędzia run only here.
    # A pull request runs only the skills whose verdict its changes can alter; a push to main runs them all.
    # Each part runs a third of the steps (a baseline or one mutation script) by their CI time: side by side on one
    # runner they exceed their time limits.
    name: Mutation checks (${{ matrix.part }}/3)
    runs-on: windows-latest
    # tools/mutacje_skilli.py limits each script to 30 min; this catches a hang in the runner itself.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 the base it merges into.
          fetch-depth: 2

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -r requirements.txt

      # verify-centrum-rozliczen drives Centrum in Chromium.
      - name: Install Playwright
        run: uv pip install --system --python "${{ steps.python.outputs.python-path }}" -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run each verify skill's baseline check and prove it fails on broken variants
        id: skills
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            python tools/mutacje_skilli.py --czesc ${{ matrix.part }}/3 --zmiany-od HEAD^1
          } else {
            python tools/mutacje_skilli.py --czesc ${{ matrix.part }}/3
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Mutation checks failed (exit code $LASTEXITCODE)"
          }

      # A red baseline (e.g. Centrum --feature all) leaves its screenshots and logs here; mutation copies keep none.
      - name: Upload baseline evidence on failure
        if: ${{ failure() && steps.skills.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-checks-evidence-${{ matrix.part }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  required:
    # Configure only this stable status as required in branch protection.
    name: Required CI status
    runs-on: ubuntu-latest
    needs:
      - szybkie
      - pytest
      - mutations
      - change-mutations
    if: ${{ always() }}
    steps:
      - name: Require every CI check to succeed
        shell: python3 {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          import json
          import os
          import sys

          # On a push to main Change mutations does not start: there is no change to mutate.
          may_skip = {"change-mutations"} if os.environ["EVENT"] == "push" else set()
          failed = [
              f"{job}={need['result']}"
              for job, need in json.loads(os.environ["NEEDS"]).items()
              if need["result"] != "success" and not (job in may_skip and need["result"] == "skipped")
          ]
          if failed:
              sys.exit(f"Required CI checks did not all succeed: {', '.join(failed)}")
          print("All required CI checks succeeded.")
