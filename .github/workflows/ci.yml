name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint Python code
        run: python -m ruff check

  mypy:
    name: mypy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Typecheck Python code
        run: python -m mypy

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Route py -3 to the selected Python
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        run: py -3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: py -3 -m pytest -n auto

  mutations:
    # A mutation check's verdict does not depend on the Python version, so it runs once, beside pytest.
    name: Mutation checks
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prove each verify skill's check fails on broken variants
        run: python tools/mutacje_skilli.py

  e2e:
    name: E2E (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Route py -3 to the selected Python
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        run: py -3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run end-to-end verification
        shell: pwsh
        run: |
          py -3 .agents/skills/verify-rozliczenia/scripts/run_verification.py --variant all
          if ($LASTEXITCODE -ne 0) {
            throw "E2E verification failed (exit code $LASTEXITCODE)"
          }

      - name: Upload E2E evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-python-${{ matrix.python-version }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  timing:
    # Straż czasu Przebiegu rozliczeń (spec #141, #145): benchmark „typowy tydzień” na syntetycznych
    # Wzorcach kształtu Wzorców taty (tools/syntetyczne_wzorce.py), bo prawdziwych nie ma w repozytorium.
    name: Timing guard (typowy tydzień)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      # Budżet mediany czasu ściany typowego tygodnia na runnerze; job pada tylko powyżej niego.
      # Docelowo 3 × cel twardy po przeliczeniu na runner: 3 × 18 s (Mac M4 Max) × ~3,3 ≈ 180 000 ms.
      # Przelicznik 3,3 to Mac → komputer taty (i7-10875H); windows-latest ma podobną wydajność
      # jednego rdzenia. Sprawdź go w podsumowaniach pierwszych jobów (Sprawdzanie runnera / Maca).
      # Po #147 (ADR 0008) Przebieg trwa ~3 s na Macu, czyli ~10 s na runnerze: budżet przepuszcza
      # szum współdzielonych runnerów, a łapie powrót do pełnego zapisu przez openpyxl (~240 s).
      # To jedyne miejsce budżetu.
      PRZEBIEG_BUDGET_MS: '180000'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate synthetic Wzorce
        shell: pwsh
        run: |
          python tools/syntetyczne_wzorce.py "$env:RUNNER_TEMP\syntetyczne-wzorce"
          if ($LASTEXITCODE -ne 0) {
            throw "Synthetic Wzorce generation failed (exit code $LASTEXITCODE)"
          }

      - name: Measure Przebieg rozliczeń (typowy tydzień)
        shell: pwsh
        run: |
          $templates = "$env:RUNNER_TEMP\syntetyczne-wzorce"
          python tools/benchmark_przebiegu.py measure --scenario typowy-tydzien `
            --templates-dir $templates --config "$templates\worker_mapping.yaml" `
            --mirror-dir "$env:RUNNER_TEMP\lustro" --journal "$env:RUNNER_TEMP\przebieg.jsonl" `
            --machine github-windows-latest
          if ($LASTEXITCODE -ne 0) {
            throw "Benchmark failed (exit code $LASTEXITCODE)"
          }

      - name: Report timings and enforce the budget
        shell: pwsh
        run: |
          python tools/benchmark_przebiegu.py guard --journal "$env:RUNNER_TEMP\przebieg.jsonl" `
            --budget-ms $env:PRZEBIEG_BUDGET_MS --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
            throw "Przebieg rozliczeń exceeded the timing budget of $env:PRZEBIEG_BUDGET_MS ms (exit code $LASTEXITCODE)"
          }

      - name: Upload benchmark failure output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: timing-guard-output
          path: ${{ runner.temp }}/lustro/ostatni-blad-*.txt
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    # Centrum rozliczeń: the committed build and contract must match their sources (tata has no Node).
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies (pinned FastAPI and Pydantic shape the contract)
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate the contract from the server models
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run contract

      - name: Typecheck (tsc strict)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (Oxlint with anti-slop)
        working-directory: frontend
        run: npm run lint

      - name: Frontend rules (every contract field used, no process-name comparisons)
        working-directory: frontend
        run: npm run rules

      - name: Unused files, exports and dependencies (knip)
        working-directory: frontend
        run: npm run unused

      - name: Duplicated code (jscpd)
        working-directory: frontend
        run: npm run duplicates

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Require the committed contract and build to be fresh
        run: |
          stale="$(git status --porcelain -- frontend/src/api src/rozliczenia/centrum/static)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "Run 'npm run contract' and 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

  required:
    # Configure only this stable status as required in branch protection.
    name: Required CI status
    runs-on: windows-latest
    needs:
      - ruff
      - mypy
      - pytest
      - mutations
      - e2e
      - timing
      - frontend
    if: ${{ always() }}
    steps:
      - name: Require every CI check to succeed
        shell: pwsh
        env:
          RUFF_RESULT: ${{ needs.ruff.result }}
          MYPY_RESULT: ${{ needs.mypy.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TIMING_RESULT: ${{ needs.timing.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          $results = [ordered]@{
            Ruff = $env:RUFF_RESULT
            mypy = $env:MYPY_RESULT
            pytest = $env:PYTEST_RESULT
            Mutations = $env:MUTATIONS_RESULT
            E2E = $env:E2E_RESULT
            Timing = $env:TIMING_RESULT
            Frontend = $env:FRONTEND_RESULT
          }
          $failedChecks = @(
            foreach ($result in $results.GetEnumerator()) {
              if ($result.Value -ne 'success') {
                "$($result.Key)=$($result.Value)"
              }
            }
          )
          if ($failedChecks.Count -gt 0) {
            throw "Required CI checks did not all succeed: $($failedChecks -join ', ')"
          }
          Write-Host 'All required CI checks succeeded.'
