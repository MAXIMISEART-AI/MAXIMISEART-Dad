name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint Python code
        run: python -m ruff check run.py src tests tools .agents/skills/verify-rozliczenia/scripts

  mypy:
    name: mypy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Typecheck Python code
        run: python -m mypy

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Route py -3 to the selected Python
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        run: py -3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: py -3 -m pytest

  e2e:
    name: E2E (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Route py -3 to the selected Python
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.github\scripts" -Encoding utf8

      - name: Verify py -3 interpreter
        run: |
          $actualVersion = py -3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($actualVersion -ne $env:EXPECTED_PYTHON_VERSION) {
            throw "py -3 resolved to Python $actualVersion; expected $env:EXPECTED_PYTHON_VERSION."
          }

      - name: Install test dependencies
        run: py -3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run end-to-end verification
        shell: pwsh
        run: |
          $verificationScript = ".agents/skills/verify-rozliczenia/scripts/run_verification.py"
          $failedVariants = @()
          foreach ($variant in @("default", "existing", "locked")) {
            Write-Host "Running E2E verification variant: $variant"
            py -3 $verificationScript --variant $variant
            if ($LASTEXITCODE -ne 0) {
              $failedVariants += "$variant (exit code $LASTEXITCODE)"
            }
          }
          if ($failedVariants.Count -gt 0) {
            throw "E2E verification failed: $($failedVariants -join ', ')"
          }

      - name: Upload E2E evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-python-${{ matrix.python-version }}
          path: .verification/evidence/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  required:
    # Configure only this stable status as required in branch protection.
    name: Required CI status
    runs-on: windows-latest
    needs:
      - ruff
      - mypy
      - pytest
      - e2e
    if: ${{ always() }}
    steps:
      - name: Require every CI check to succeed
        shell: pwsh
        env:
          RUFF_RESULT: ${{ needs.ruff.result }}
          MYPY_RESULT: ${{ needs.mypy.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          $results = [ordered]@{
            Ruff = $env:RUFF_RESULT
            mypy = $env:MYPY_RESULT
            pytest = $env:PYTEST_RESULT
            E2E = $env:E2E_RESULT
          }
          $failedChecks = @(
            foreach ($result in $results.GetEnumerator()) {
              if ($result.Value -ne 'success') {
                "$($result.Key)=$($result.Value)"
              }
            }
          )
          if ($failedChecks.Count -gt 0) {
            throw "Required CI checks did not all succeed: $($failedChecks -join ', ')"
          }
          Write-Host 'All required CI checks succeeded.'
