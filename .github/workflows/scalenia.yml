name: Scalenia otwartych PR

# After every push to main, each open PR to main gets the commit status "scalenie z main": does its merge with the
# new main pass without a conflict, and do ruff and mypy pass on it (tools/scalenia_pr.py).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baza:
        description: 'Check open PRs to this branch, merged with its tip'
        required: false
        default: main

# The job runs code from same-repository PR branches, as ci.yml does; tools/scalenia_pr.py skips PRs from forks,
# because this token can write any commit status, also the one the ruleset requires.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: scalenia-${{ inputs.baza || 'main' }}
  cancel-in-progress: true

jobs:
  scalenia:
    name: Scalenia otwartych PR z bazą
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check each open PR merged with its base and set its status
        env:
          GH_TOKEN: ${{ github.token }}
          BAZA: ${{ inputs.baza || 'main' }}
        run: python tools/scalenia_pr.py --publikuj --baza "$BAZA"
