# Kody prac taty — mapping "1" → opis pracy
# Source of truth: tata. System agent mapuje z mailów na podstawie tego pliku.
#
# Każdy kod:
#   code: integer (1, 2, 3, ...)
#   name: krótka nazwa (display w raporcie)
#   description: pełny opis (fuzzy match dla Haiku classifier)
#   keywords: lista słów/skrótów których pracownicy używają w mailach (pattern match)
#   unit: jednostka miary (metry, sztuki, mieszkania, spawy)
#   high_stakes: true = Mutation #39 triple-vote zawsze na tym kodzie
#
# PLACEHOLDER — Phase 2 requires full lista od taty

schema_version: 1
updated: 2026-04-24

codes:
  - code: 1
    name: Przykład-typ-A
    description: "PLACEHOLDER — tata dostarczy opis co znaczy '1' w jego systemie"
    keywords: []
    unit: sztuki
    high_stakes: false
    active: false

  - code: 2
    name: Przykład-typ-B
    description: "PLACEHOLDER — tata dostarczy opis co znaczy '2'"
    keywords: []
    unit: sztuki
    high_stakes: false
    active: false

