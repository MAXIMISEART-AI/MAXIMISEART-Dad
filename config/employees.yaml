# Roster pracowników taty
#
# Każdy pracownik musi mieć wpis żeby Mutation #44 Persona Hyperstition
# nie zablokowała jego maili jako BLOCKED.
#
# Dodawanie nowego pracownika:
# 1. Unique `slug` (kebab-case imię-nazwisko)
# 2. `email` musi matchować From: w mailach Gmail (case-insensitive)
# 3. `email_aliases` — inne adresy tego samego pracownika (plus-addressing, osobiste)
# 4. `aliases` — warianty imienia (np. "Janek", "J.K.") dla pattern matching
# 5. `kody_prac_typowe` — Phase 2+ (znane kody prac, pomaga Red Team)
# 6. `styl_pisania` — Phase 3+ tagi (short/long/skrot-heavy/punctuation-none)
# 7. `active: true` — tylko wtedy brany pod uwagę przez router
#
# Source of truth: tata (po Phase 1 MVP). Phase 1 test roster = 3 pracownicy Maks test.

schema_version: 1
updated: 2026-04-24

employees:
  # === Phase 1 MVP test roster (Maks test account) ===
  # Wysyłasz maile z prefix [DAD-TEST] na swoje własne konto jako te 3 persony.
  # Gmail plus-addressing (makspokora100+jan@gmail.com) lub osobne aliasy.

  - slug: jan-kowalski
    name: Jan Kowalski
