# Daily workflow schedule
# Ten plik ładowany przez daily_workflow.py + setup-windows-task.ps1

schema_version: 1
updated: 2026-04-24

# === Timing ===
daily_run_time: "06:30"              # 24h Europe/Warsaw, HH:MM
timezone: "Europe/Warsaw"

# === Weekends ===
run_on_weekends: true                # true = Sat+Sun też, false = tylko pon-pt
# Gdy true + weekend + empty mailbox → raport graceful "0 emaili, OK?"

# === Holidays ===
skip_holidays: false                 # TODO Phase 4: integrate Polish holidays calendar

# === Retry policy ===
max_retries: 3                       # Task Scheduler RestartCount
retry_interval_minutes: 15           # Task Scheduler RestartInterval

# === Gmail harvest window ===
harvest_lookback_hours: 24           # Czytaj maile z ostatnich N godzin
harvest_unread_only: false           # true = tylko unread, false = wszystkie w okresie

# === Fatigue thresholds (Mut #46) ===
fatigue_critical_days: 3             # Alert gdy N dni bez feedback
fatigue_approve_rate_alert: 0.80     # Alert gdy >80% automatic APPROVE
fatigue_median_time_alert_sec: 30    # Alert gdy median time < 30s

# === Retention ===
brain_retention_days: 90             # Po N dniach maile archive-do _archive/
excel_snapshots_keep: 30             # Trzymaj ostatnie N snapshotów Excela
logs_keep_days: 60                   # Rotate logs po N dniach

# === Cost controls ===
max_api_cost_pln_per_day: 5.0        # Hard cap — abort jeśli przekroczony
haiku_confidence_threshold: 0.9      # Mut #29 — gdy Haiku >= 0.9 → skip Sonnet
