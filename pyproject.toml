[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maximiseart-dad-settlements"
version = "0.1.0"
description = "Lokalne, deterministyczne rozdzielanie rozliczenia zbiorczego na pliki pracowników."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "PyYAML>=6.0",
    "fastapi>=0.146",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    "fastapi==0.146.0",
    "httpx2==2.14.0",
    "hypothesis==6.170.5",
    "mypy==2.0.0",
    "playwright==1.64.0",
    "pydantic==2.14.1",
    "pytest==8.3.3",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
    "types-openpyxl==3.1.5.20260827",
    "types-PyYAML==6.0.12.20260906",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config"]
# Najwolniejszy test trwa kilka sekund; zawieszony test kończy się błędem zamiast blokować przebieg.
timeout = 120

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rozliczenia.centrum" = ["static/**/*", "*.ico"]

[tool.ruff]
target-version = "py311"
include = [
    "/*.py",
    "src/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    "tools/hooks/pre-push",
    ".agents/skills/*/scripts/**/*.py",
]
extend-exclude = [".claude"]

[tool.ruff.lint]
# Szeroki except tylko z wpisem do dziennika albo ponownym rzuceniem.
extend-select = ["BLE001", "S110"]

[tool.mypy]
strict = true
files = [
    "*.py",
    "src",
    "tests",
    "tools",
    "tools/hooks/pre-push",
    ".agents/skills/*/scripts",
]
mypy_path = "src"
show_error_codes = true
