[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maximiseart-dad-settlements"
version = "0.1.0"
description = "Lokalne, deterministyczne rozdzielanie rozliczenia zbiorczego na pliki pracowników."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
    "mypy==2.0.0",
    "pytest==8.3.3",
    "ruff==0.15.12",
    "types-openpyxl==3.1.5.20260827",
    "types-PyYAML==6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
include = [
    "run.py",
    "src/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    ".agents/skills/verify-rozliczenia/scripts/*.py",
]

[tool.mypy]
strict = true
files = [
    "run.py",
    "src",
    "tests",
    "tools",
    ".agents/skills/verify-rozliczenia/scripts",
]
mypy_path = "src"
show_error_codes = true
